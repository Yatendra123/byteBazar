server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:ugrow}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: orders
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: orders
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082
          jwk-set-uri: http://localhost:8082/oauth2/jwks

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

order:
  outbox:
    publish-batch-size: 50
    publisher-fixed-delay-ms: 2000
  messaging:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    queue-url: ${ORDER_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/order-events}
    payment-queue-url: ${PAYMENT_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/payment-events}
    payment-poll-delay-ms: 5000
