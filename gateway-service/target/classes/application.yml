server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        - id: catalog-products
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0
        - id: catalog-categories
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/categories/**
          filters:
            - StripPrefix=0
        - id: order
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0
        - id: payment
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0
        - id: customer
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - StripPrefix=0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
