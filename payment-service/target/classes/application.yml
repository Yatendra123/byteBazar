server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bytebazar_payments}
    username: ${DB_USER:bytebazar}
    password: ${DB_PASSWORD:bytebazar123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: payments
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: payments
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082
          jwk-set-uri: http://localhost:8082/oauth2/jwks

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      primaryProvider:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      primaryProvider:
        maxAttempts: 2
        waitDuration: 200ms

payment:
  demo:
    failPrimary: false
  messaging:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    order-queue-url: ${ORDER_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/order-events}
    payment-queue-url: ${PAYMENT_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/payment-events}
    poll-delay-ms: 5000
