server:
  port: 8085

spring:
  application:
    name: customer-service
  
  # H2 In-Memory Database Configuration for Testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  # H2 Console for debugging (optional)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # JPA Configuration for H2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # Disable Flyway for H2 testing
  flyway:
    enabled: false

  # OAuth2 Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Logging Configuration
logging:
  level:
    com.byteBazar.customer: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
